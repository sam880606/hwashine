<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>聯絡我們 | MXD6 高性能尼龍</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js"></script>
    <!-- 全站統一深色質感工業風設計系統 -->
    <link rel="stylesheet" href="/assets/css/theme.css">
    <script src="/components.js" defer></script>
</head>
<body class="hs-dark">
  <custom-header compact="true"></custom-header>

  <main class="page">
    <h1 class="animate-on-load" data-delay="0">聯絡我們</h1>
    <div class="contact-grid">
      <div class="animate-on-scroll">
        <h2>聯絡方式</h2>
        <p><strong>公司：</strong>華翔興業有限公司</p>
        <p><strong>電話：</strong>02-77337581</p>
        <p><strong>電子郵件：</strong>info@hwashine.tw</p>
        <p><strong>地址：</strong>臺北市信義區信義路5段7號37樓</p>
        <div class="mini-links">
          <a class="mini-link" href="./products.html">回到產品中心</a>
          <a class="mini-link" href="./solutions.html">查看應用/數據</a>
        </div>
      </div>
      <form id="contactForm" class="card form animate-on-scroll" action="https://formspree.io/f/xblrnwnz" method="POST">
        <h2>留下您的需求</h2>
        <label>
          公司/姓名
          <input type="text" name="name" required placeholder="您的名稱">
        </label>
        <label>
          電子郵件
          <input type="email" name="email" required placeholder="you@example.com">
        </label>
        <label>
          電話
          <input type="tel" name="phone" required placeholder="+886-">
        </label>
        <label>
          需求類型
          <select name="topic" required>
            <option value="">請選擇</option>
            <option>工程塑料</option>
            <option>阻隔包裝</option>
            <option>技術支持</option>
            <option>採購/報價</option>
          </select>
        </label>
        <label>
          訊息
          <textarea name="message" rows="4" required placeholder="請描述您的應用、材料需求或數量..."></textarea>
        </label>
        <div class="form-actions">
          <button type="submit" class="btn primary">送出</button>
        </div>
        <p class="form-note" id="formNote" role="status" aria-live="polite"></p>
      </form>
    </div>
  </main>

  <custom-footer></custom-footer>
<script src="https://static.cloudflareinsights.com/beacon.min.js/vcd15cbe7772f49c399c6a5babf22c1241717689176015" xintegrity="sha512-ZpsOmlRQV6y907TI0dKBHq9Md29nnaEIPlkf84rnaERnq6zvWvPUqr2ft8M1aS28oN72PdrCzSjY4U6VaAw1EQ==" data-cf-beacon='{"version":"2024.11.0","token":"3e0e168fcc584b3aae69cd7f0b37248e","r":1,"server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
